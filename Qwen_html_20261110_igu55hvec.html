<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f2f2f7">
    <title>Контроль Платежей</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #000000;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --green: #34c759;
            --red: #ff3b30;
            --orange: #ff9500;
            --border: #e5e5ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        header {
            padding: 20px 16px 10px;
            font-size: 28px;
            font-weight: 700;
        }

        .view { display: none; padding: 0 16px; }
        .view.active { display: block; }

        /* Карточки статистики */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .stat-card.full { grid-column: 1 / -1; }
        .stat-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-value.income { color: var(--green); }
        .stat-value.expense { color: var(--red); }
        .stat-value.savings { color: var(--orange); }

        /* Список платежей */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 20px 0 10px;
        }
        .payment-card {
            background: var(--card);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: relative;
            border-left: 4px solid var(--accent);
        }
        .payment-card.paid { border-left-color: var(--green); opacity: 0.8; }
        .payment-card.mandatory { border-left-color: var(--red); }
        
        .pay-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .pay-purpose { font-size: 17px; font-weight: 600; flex: 1; margin-right: 10px;}
        .pay-amount { font-size: 18px; font-weight: 700; white-space: nowrap; }
        
        .pay-details { font-size: 14px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;}
        .badge {
            background: var(--bg);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge.overdue { background: #ffe5e5; color: var(--red); }
        .badge.monthly { background: #e5f1ff; color: var(--accent); }
        
        .pay-actions { display: flex; gap: 10px; }
        .btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }
        .btn-secondary { background: var(--bg); color: var(--text); }

        /* Форма добавления */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 16px;
            background: var(--card);
            outline: none;
        }
        .form-control:focus { border-color: var(--accent); }
        
        .checkbox-group { display: flex; gap: 20px; margin-top: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .checkbox-item input { width: 20px; height: 20px; accent-color: var(--accent); }

        /* Нижняя навигация */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            z-index: 100;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px 15px;
        }
        .tab-item.active { color: var(--accent); }
        .tab-icon { font-size: 24px; margin-bottom: 2px; }

        .empty-state { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 16px;}
    </style>
</head>
<body>

    <header id="app-title">Главная</header>

    <!-- Главная -->
    <div id="view-home" class="view active">
        <div class="stats-grid">
            <div class="stat-card full">
                <div class="stat-label">Общий Баланс</div>
                <div class="stat-value" id="stat-balance">0 ₽</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Поступления</div>
                <div class="stat-value income" id="stat-income">0 ₽</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Расходы</div>
                <div class="stat-value expense" id="stat-expense">0 ₽</div>
            </div>
            <div class="stat-card full">
                <div class="stat-label">Накопления</div>
                <div class="stat-value savings" id="stat-savings">0 ₽</div>
            </div>
        </div>
        <div class="section-title">Ближайшие обязательные</div>
        <div id="upcoming-list"></div>
    </div>

    <!-- Платежи -->
    <div id="view-payments" class="view">
        <div class="section-title">Все операции</div>
        <div id="payments-list"></div>
    </div>

    <!-- Добавление -->
    <div id="view-add" class="view">
        <form id="payment-form">
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Тип операции</label>
                <select id="type" class="form-control" required>
                    <option value="expense">Расход</option>
                    <option value="income">Поступление</option>
                    <option value="savings">Накопления</option>
                </select>
            </div>
            <div class="form-group">
                <label>Сумма (₽)</label>
                <input type="number" id="amount" class="form-control" placeholder="0" required min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>Назначение платежа</label>
                <input type="text" id="purpose" class="form-control" placeholder="Например: Аренда, Зарплата" required>
            </div>
            <div class="form-group">
                <label>Дата (до какого числа)</label>
                <input type="date" id="due-date" class="form-control" required>
            </div>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="is-mandatory">
                    Обязательный
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="is-monthly">
                    Ежемесячный
                </label>
            </div>
            <div style="margin-top: 24px; display: flex; gap: 12px;">
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Очистить</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>

    <!-- Нижняя навигация -->
    <div class="tab-bar">
        <div class="tab-item active" onclick="switchView('home', 'Главная')">
            <div class="tab-icon">🏠</div>
            <div>Главная</div>
        </div>
        <div class="tab-item" onclick="switchView('payments', 'Платежи')">
            <div class="tab-icon">📋</div>
            <div>Платежи</div>
        </div>
        <div class="tab-item" onclick="switchView('add', 'Добавить')">
            <div class="tab-icon">➕</div>
            <div>Добавить</div>
        </div>
    </div>

    <script>
        // Инициализация данных
        let payments = JSON.parse(localStorage.getItem('finance_payments')) || [];
        
        // Элементы DOM
        const views = document.querySelectorAll('.view');
        const tabs = document.querySelectorAll('.tab-item');
        const title = document.getElementById('app-title');
        const form = document.getElementById('payment-form');

        // Переключение вкладок
        function switchView(viewName, newTitle) {
            views.forEach(v => v.classList.remove('active'));
            tabs.forEach(t => t.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            event.currentTarget.classList.add('active');
            title.textContent = newTitle;
            
            if (viewName === 'home') renderDashboard();
            if (viewName === 'payments') renderPayments();
            if (viewName === 'add') resetForm();
        }

        // Форматирование денег
        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(amount);
        }

        // Форматирование даты
        function formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Сохранение
        function saveData() {
            localStorage.setItem('finance_payments', JSON.stringify(payments));
        }

        // Рендер Главной
        function renderDashboard() {
            let income = 0, expense = 0, savings = 0;
            payments.forEach(p => {
                if (p.isPaid) {
                    if (p.type === 'income') income += p.amount;
                    else if (p.type === 'expense') expense += p.amount;
                    else if (p.type === 'savings') savings += p.amount;
                }
            });

            document.getElementById('stat-balance').textContent = formatMoney(income - expense - savings);
            document.getElementById('stat-income').textContent = formatMoney(income);
            document.getElementById('stat-expense').textContent = formatMoney(expense);
            document.getElementById('stat-savings').textContent = formatMoney(savings);

            // Ближайшие обязательные неоплаченные
            const today = new Date();
            today.setHours(0,0,0,0);
            const upcoming = payments
                .filter(p => p.isMandatory && !p.isPaid && new Date(p.dueDate) >= today)
                .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
                .slice(0, 3);

            const list = document.getElementById('upcoming-list');
            if (upcoming.length === 0) {
                list.innerHTML = '<div class="empty-state">Нет предстоящих обязательных платежей 🎉</div>';
            } else {
                list.innerHTML = upcoming.map(p => createPaymentCard(p)).join('');
            }
        }

        // Рендер Списка платежей
        function renderPayments() {
            const list = document.getElementById('payments-list');
            if (payments.length === 0) {
                list.innerHTML = '<div class="empty-state">Список пуст. Добавьте первую операцию!</div>';
                return;
            }
            
            // Сортировка: неоплаченные по дате, затем оплаченные
            const sorted = [...payments].sort((a, b) => {
                if (a.isPaid !== b.isPaid) return a.isPaid ? 1 : -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            list.innerHTML = sorted.map(p => createPaymentCard(p)).join('');
        }

        // Создание карточки платежа
        function createPaymentCard(p) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const dueDate = new Date(p.dueDate);
            const isOverdue = !p.isPaid && dueDate < today;
            
            let badges = '';
            if (p.isMonthly) badges += '<span class="badge monthly">Ежемесячно</span>';
            if (isOverdue) badges += '<span class="badge overdue">Просрочено!</span>';
            if (p.isMandatory) badges += '<span class="badge" style="background:#ffe5e5; color:#ff3b30;">Обязательный</span>';
            
            let statusText = p.isPaid ? `Оплачено: ${formatDate(p.paidDate)}` : `Оплатить до: ${formatDate(p.dueDate)}`;
            
            let actions = '';
            if (!p.isPaid) {
                actions += `<button class="btn btn-success" onclick="markAsPaid(${p.id})">Отметить перевод</button>`;
                actions += `<button class="btn btn-secondary" onclick="editPayment(${p.id})">Изм.</button>`;
            } else {
                actions += `<button class="btn btn-secondary" onclick="markAsUnpaid(${p.id})">Вернуть</button>`;
            }
            actions += `<button class="btn btn-danger" onclick="deletePayment(${p.id})">✕</button>`;

            return `
                <div class="payment-card ${p.isPaid ? 'paid' : ''} ${p.isMandatory ? 'mandatory' : ''}">
                    <div class="pay-header">
                        <div class="pay-purpose">${p.purpose}</div>
                        <div class="pay-amount" style="color: ${p.type === 'income' ? 'var(--green)' : p.type === 'savings' ? 'var(--orange)' : 'var(--red)'}">
                            ${p.type === 'income' ? '+' : '-'}${formatMoney(p.amount)}
                        </div>
                    </div>
                    <div class="pay-details">
                        <span>${statusText}</span>
                        ${badges}
                    </div>
                    <div class="pay-actions">
                        ${actions}
                    </div>
                </div>
            `;
        }

        // Действия
        function markAsPaid(id) {
            const p = payments.find(x => x.id === id);
            if (p) {
                p.isPaid = true;
                p.paidDate = new Date().toISOString().split('T')[0]; // Сегодняшняя дата
                saveData();
                renderPayments();
                renderDashboard();
            }
        }

        function markAsUnpaid(id) {
            const p = payments.find(x => x.id === id);
            if (p) {
                p.isPaid = false;
                p.paidDate = null;
                saveData();
                renderPayments();
                renderDashboard();
            }
        }

        function deletePayment(id) {
            if (confirm('Удалить эту операцию?')) {
                payments = payments.filter(x => x.id !== id);
                saveData();
                renderPayments();
                renderDashboard();
            }
        }

        function editPayment(id) {
            const p = payments.find(x => x.id === id);
            if (p) {
                switchView('add', 'Редактирование');
                // Активируем вкладку добавления визуально
                tabs[0].classList.remove('active');
                tabs[1].classList.remove('active');
                tabs[2].classList.add('active');
                
                document.getElementById('edit-id').value = p.id;
                document.getElementById('type').value = p.type;
                document.getElementById('amount').value = p.amount;
                document.getElementById('purpose').value = p.purpose;
                document.getElementById('due-date').value = p.dueDate;
                document.getElementById('is-mandatory').checked = p.isMandatory;
                document.getElementById('is-monthly').checked = p.isMonthly;
            }
        }

        function resetForm() {
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('due-date').value = new Date().toISOString().split('T')[0];
        }

        // Обработка формы
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            
            const data = {
                id: editId ? parseInt(editId) : Date.now(),
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                purpose: document.getElementById('purpose').value,
                dueDate: document.getElementById('due-date').value,
                isMandatory: document.getElementById('is-mandatory').checked,
                isMonthly: document.getElementById('is-monthly').checked,
                isPaid: false,
                paidDate: null
            };

            if (editId) {
                const idx = payments.findIndex(x => x.id === parseInt(editId));
                if (idx !== -1) {
                    data.isPaid = payments[idx].isPaid;
                    data.paidDate = payments[idx].paidDate;
                    payments[idx] = data;
                }
            } else {
                payments.push(data);
            }

            saveData();
            resetForm();
            switchView('payments', 'Платежи');
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
            tabs[2].classList.remove('active');
        });

        // Первоначальный рендер
        renderDashboard();
        document.getElementById('due-date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
